[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "duplicate-file-finder"
version = "1.0.0"
description = "Find duplicate files using file size grouping and SHA-256 checksums without deleting anything."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "GitHub Content Pack Contributor" }]
dependencies = []
keywords = ["python", "cli", "sha256", "duplicate-files", "file-management"]

[project.scripts]
find-duplicates = "duplicate_file_finder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
